name: CGV seat alert

# 외부 크론 서비스(cron-job.org 등)가 5분마다 workflow_dispatch API 를 호출해 실행한다.
# 한 실행 = 잔여석 1회 조회. 이전 조회 결과(state.json)는 Actions 캐시로 이어진다.
# GitHub 자체 schedule(cron) 은 무료 플랜에서 지연·생략이 심해 쓰지 않는다.
#
# 호출 예:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/cgv-seat-alert.yml/dispatches
#   Authorization: Bearer <fine-grained PAT, Actions: Read and write>
#   Accept: application/vnd.github+json
#   Content-Type: application/json
#   {"ref":"main"}
# 성공 응답은 204 No Content.

on:
  workflow_dispatch:
    inputs:
      jitter_max_sec:
        description: "조회 전 0~N초 랜덤 대기 (비우면 Variables 의 JITTER_MAX_SEC, 없으면 0)"
        required: false
        default: ""

concurrency:
  group: cgv-seat-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare config
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
          fi

      - name: Restore previous seat state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: cgv-state-${{ github.run_id }}
          restore-keys: |
            cgv-state-

      - name: Random jitter before check
        env:
          JITTER_INPUT: ${{ inputs.jitter_max_sec }}
          JITTER_VAR: ${{ vars.JITTER_MAX_SEC }}
        run: |
          max="${JITTER_INPUT:-${JITTER_VAR:-0}}"
          if [[ "$max" =~ ^[0-9]+$ ]] && [ "$max" -gt 0 ]; then
            wait=$(( RANDOM % (max + 1) ))
            echo "조회 전 ${wait}초 대기 (0~${max}초 랜덤)"
            sleep "$wait"
          else
            echo "지터 없음"
          fi

      - name: Check remaining seats once
        env:
          # 알림 (Secrets)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 감시할 상영 — Repo Variables 권장 (Settings → Variables)
          THEATER_CODE: ${{ vars.THEATER_CODE }}
          THEATER_KEYWORD: ${{ vars.THEATER_KEYWORD }}
          THEATER_NAME: ${{ vars.THEATER_NAME }}
          MOVIE_CODE: ${{ vars.MOVIE_CODE }}
          MOVIE_NAME: ${{ vars.MOVIE_NAME }}
          PLAY_DATE: ${{ vars.PLAY_DATE }}
          START_TIME: ${{ vars.START_TIME }}
          ALERT_SOURCE: Actions
        run: python -u monitor.py --once

      - name: Save seat state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cgv-state-${{ github.run_id }}
